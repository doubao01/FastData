name: Release

on:
  push:
    tags: ['v*']

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest
    permissions:
      contents: write
      packages: write

    # 必须放在 job 级：GitHub 在评估 step 的 `if` 时还读不到该 step 自己的 env，
    # 原来把 NUGET_API_KEY 写在 step 的 env 里、再用 `if: env.NUGET_API_KEY != ''`，
    # 条件是永远为假的 —— 发布因此从未执行过。
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check upstream license gate
        shell: bash
        run: |
          if ! grep -q '状态：已授权' FastData/docs/UPSTREAM_LICENSE.md \
             && ! grep -q '状态：维护者风险接受' FastData/docs/UPSTREAM_LICENSE.md; then
            echo "::error::上游授权未确认且无风险接受记录，禁止发布。见 FastData/docs/UPSTREAM_LICENSE.md"
            exit 1
          fi

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore FastData.sln -p:BuildPlatform=windows

      - name: Build
        run: dotnet build FastData.sln -p:BuildPlatform=windows -c Release --no-restore

      - name: Test
        run: dotnet test FastData.Tests/FastData.Tests.csproj -c Release --no-build --filter "FullyQualifiedName!~Integration&FullyQualifiedName!~OrmCrudTests&FullyQualifiedName!~StressTests.Concurrent&FullyQualifiedName!~StressTests.MixedOperations" -v minimal

      - name: Pack
        run: |
          dotnet pack FastData/FastData.csproj -c Release --no-build -p:BuildPlatform=windows -p:Version=${{ steps.version.outputs.VERSION }} -o artifacts
          dotnet pack FastData.Untility/FastData.Untility.csproj -c Release --no-build -p:BuildPlatform=windows -p:Version=${{ steps.version.outputs.VERSION }} -o artifacts

      - name: Collect DLLs
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $out = "dlls"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          foreach ($tfm in @("net452", "net8.0", "net10.0")) {
            $dir = Join-Path $out $tfm
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            foreach ($project in @("FastData", "FastData.Untility")) {
              $base = Join-Path $project "bin\Release\$tfm"
              foreach ($file in @("FastData.dll", "FastData.xml", "FastData.Untility.dll", "FastData.Untility.xml")) {
                $src = Join-Path $base $file
                if (Test-Path $src) { Copy-Item $src $dir -Force }
              }
            }
          }
          $readmeLines = @(
            "FastData $version - DLL package",
            "",
            "Target frameworks:",
            "  net452   .NET Framework 4.5.2",
            "  net8.0   .NET 8",
            "  net10.0  .NET 10",
            "",
            "Each folder contains:",
            "  FastData.dll",
            "  FastData.xml",
            "  FastData.Untility.dll",
            "  FastData.Untility.xml",
            "",
            "These are the same binaries packed into FastData.Orm.$version.nupkg and FastData.Untility.$version.nupkg.",
            "For manual references, add the NuGet dependencies listed in the corresponding .nuspec files."
          )
          Set-Content -Path (Join-Path $out "README.txt") -Value ($readmeLines -join ([char]10)) -Encoding utf8
          Compress-Archive -Path "$out/*" -DestinationPath "artifacts/FastData.$version-dlls.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.nupkg
            artifacts/*-dlls.zip
          generate_release_notes: true
          draft: true

      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ env.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        if: env.NUGET_API_KEY != ''
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
