name: Build and Test

on:
  push:
    branches: [ main, develop, master, 'release/**' ]
  pull_request:
    branches: [ main, develop, master ]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ---- 跨平台：只构建真正的跨平台项目（核心库 + 工具库 + 测试）----
  build-core:
    name: Build Core (${{ matrix.os }}, ${{ matrix.framework }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        framework: [net8.0, net10.0]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # 逐项目构建，避免 sln 把 WinForms/Demo 拖进来
      - name: Restore core projects
        run: |
          dotnet restore FastData.Untility/FastData.Untility.csproj -p:BuildPlatform=cross
          dotnet restore FastData/FastData.csproj -p:BuildPlatform=cross
          dotnet restore FastData.Tests/FastData.Tests.csproj -p:BuildPlatform=cross

      - name: Build core projects
        run: |
          dotnet build FastData.Untility/FastData.Untility.csproj -c Release -f ${{ matrix.framework }} --no-restore
          dotnet build FastData/FastData.csproj -c Release -f ${{ matrix.framework }} --no-restore
          dotnet build FastData.Tests/FastData.Tests.csproj -c Release -f ${{ matrix.framework }} --no-restore

      - name: Run Tests (non-integration)
        run: >
          dotnet test FastData.Tests/FastData.Tests.csproj -c Release --no-build
          --framework ${{ matrix.framework }}
          --filter "FullyQualifiedName!~Integration" -v minimal

  # ---- 集成测试：连真实数据库跑 ----
  # 背景（issue #3）：此前的测试步骤用 `--filter "FullyQualifiedName!~Integration"`
  # 把所有集成测试永久排除在外，MultiDatabase* / Sharding 系列从未在 CI 跑过。
  # 这里起三个真实数据库容器，把 FASTDATA_RUN_DB_INTEGRATION 打开。
  integration-test:
    name: Integration Tests (MySQL / PostgreSQL / SQL Server)
    runs-on: ubuntu-latest
    needs: build-core

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: FastData@Test123
          MYSQL_DATABASE: fastdatademo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pFastData@Test123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: FastData@Test123
          POSTGRES_DB: fastdatademo
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: FastData@Test123
        ports:
          - 1433:1433

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: |
          dotnet restore FastData.Untility/FastData.Untility.csproj -p:BuildPlatform=cross
          dotnet restore FastData/FastData.csproj -p:BuildPlatform=cross
          dotnet restore FastData.Tests/FastData.Tests.csproj -p:BuildPlatform=cross

      - name: Build test project
        run: dotnet build FastData.Tests/FastData.Tests.csproj -c Release --no-restore -f net8.0

      # SQL Server 容器没有 health-cmd（镜像里 sqlcmd 路径随版本变化），单独等端口 + 额外宽限
      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 90); do
            if (echo > /dev/tcp/127.0.0.1/1433) >/dev/null 2>&1; then
              echo "SQL Server port is open (attempt $i)"
              sleep 20
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server 未在 180 秒内就绪" >&2
          exit 1

      - name: Run integration tests
        env:
          FASTDATA_RUN_DB_INTEGRATION: "true"
          FASTDATA_MYSQL_CONNSTR: "server=127.0.0.1;port=3306;database=fastdatademo;uid=root;pwd=FastData@Test123;SslMode=None;AllowPublicKeyRetrieval=true;Allow User Variables=true"
          FASTDATA_POSTGRESQL_CONNSTR: "host=127.0.0.1;port=5432;database=fastdatademo;username=postgres;password=FastData@Test123"
          FASTDATA_SQLSERVER_CONNSTR: "server=127.0.0.1,1433;database=FastDataDemo;uid=sa;pwd=FastData@Test123;TrustServerCertificate=true;Encrypt=False"
        run: >
          dotnet test FastData.Tests/FastData.Tests.csproj -c Release --no-build
          --framework net8.0
          --filter "FullyQualifiedName~Integration" -v minimal

  # ---- Windows 专属项目（WinForms 两个工具 + Demo）----
  build-windows-projects:
    name: Build Windows Projects (net8.0-windows / net10.0-windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore windows projects
        run: |
          dotnet restore FastData.ModelGenerator.WinForms/FastData.ModelGenerator.WinForms.csproj
          dotnet restore FastData.SyncTool.WinForms/FastData.SyncTool.WinForms.csproj
          dotnet restore FastData.Demo/FastData.Demo.csproj

      # WinForms 项目自己的 TFM 就是 -windows 后缀，不需要 -f 覆盖，让其全部构建
      - name: Build windows projects
        run: |
          dotnet build FastData.ModelGenerator.WinForms/FastData.ModelGenerator.WinForms.csproj -c Release --no-restore
          dotnet build FastData.SyncTool.WinForms/FastData.SyncTool.WinForms.csproj -c Release --no-restore
          dotnet build FastData.Demo/FastData.Demo.csproj -c Release --no-restore

  # ---- Windows Full（含 net452 传统目标）----
  build-windows-full:
    name: Build Windows Full (includes net452)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # net452 需要引用程序集
      - name: Restore (windows full)
        run: |
          dotnet restore FastData.Untility/FastData.Untility.csproj -p:BuildPlatform=windows
          dotnet restore FastData/FastData.csproj -p:BuildPlatform=windows

      - name: Build net452
        run: |
          dotnet build FastData.Untility/FastData.Untility.csproj -c Release -f net452 --no-restore -p:BuildPlatform=windows
          dotnet build FastData/FastData.csproj -c Release -f net452 --no-restore -p:BuildPlatform=windows

      - name: Build net8.0
        run: |
          dotnet build FastData.Untility/FastData.Untility.csproj -c Release -f net8.0 --no-restore
          dotnet build FastData/FastData.csproj -c Release -f net8.0 --no-restore

  # ---- 安全扫描 ----
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore for scan
        run: |
          dotnet restore FastData/FastData.csproj -p:BuildPlatform=cross
          dotnet restore FastData.Tests/FastData.Tests.csproj -p:BuildPlatform=cross

      - name: Check for vulnerable packages
        run: |
          dotnet list FastData/FastData.csproj package --vulnerable --include-transitive
          dotnet list FastData.Tests/FastData.Tests.csproj package --vulnerable --include-transitive
        continue-on-error: true

      - name: Build with analyzers
        run: |
          dotnet build FastData/FastData.csproj -c Release --no-restore /p:RunAnalyzers=true
          dotnet build FastData.Tests/FastData.Tests.csproj -c Release --no-restore /p:RunAnalyzers=true

  # ---- NuGet 打包 ----
  package:
    name: Package NuGet
    runs-on: windows-latest
    needs: [build-core, integration-test, build-windows-projects, build-windows-full, security-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || github.ref == 'refs/heads/master')

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: |
          dotnet restore FastData/FastData.csproj -p:BuildPlatform=cross
          dotnet restore FastData.Untility/FastData.Untility.csproj -p:BuildPlatform=cross

      - name: Build
        run: |
          dotnet build FastData/FastData.csproj -c Release -f net8.0 --no-restore
          dotnet build FastData.Untility/FastData.Untility.csproj -c Release -f net8.0 --no-restore
          # 多 TFM 项目 pack 时 MSBuild 会按 TargetFrameworks 列表最后一个（net10.0）找输出，
          # 显式把列表改写为单 TFM，使 pack 的输出查找与 build 产物一致
          dotnet pack FastData/FastData.csproj -c Release --no-build -p:TargetFrameworks=net8.0 -o artifacts
          dotnet pack FastData.Untility/FastData.Untility.csproj -c Release --no-build -p:TargetFrameworks=net8.0 -o artifacts

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          retention-days: 30
