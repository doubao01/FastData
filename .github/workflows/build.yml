name: Build and Test

on:
  push:
    branches: [ main, develop, master, 'release/**' ]
  pull_request:
    branches: [ main, develop, master ]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ---- 跨平台：只构建真正的跨平台项目（核心库 + 工具库 + 测试）----
  build-core:
    name: Build Core (${{ matrix.os }}, ${{ matrix.framework }})
    runs-on: ${{ matrix.os }}
    # 卡住时要「失败」而不是「被取消」：
    # 被取消的 job 日志会被清掉（查询时返回 BlobNotFound），步骤级信息也为空，
    # 事后完全无法定位。设了超时至少能在超时时保留日志。
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        framework: [net8.0, net10.0]
      # macOS runner 并发配额小，6 个任务同时抢会把 macos 的排队拉长。
      # 限制并行度，让 macos 的两个任务更快轮到。
      max-parallel: 4
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # 逐项目构建，避免 sln 把 WinForms/Demo 拖进来
      - name: Restore core projects
        run: |
          dotnet restore FastData.Untility/FastData.Untility.csproj -p:BuildPlatform=cross
          dotnet restore FastData/FastData.csproj -p:BuildPlatform=cross
          dotnet restore FastData.Tests/FastData.Tests.csproj -p:BuildPlatform=cross

      - name: Build core projects
        run: |
          dotnet build FastData.Untility/FastData.Untility.csproj -c Release -f ${{ matrix.framework }} --no-restore
          dotnet build FastData/FastData.csproj -c Release -f ${{ matrix.framework }} --no-restore
          dotnet build FastData.Tests/FastData.Tests.csproj -c Release -f ${{ matrix.framework }} --no-restore

      # 示例必须真的能跑：README 里的「5 分钟上手」若失效，
      # 开源项目的第一个 issue 就会是环境问题而不是功能问题。
      - name: Run QuickStart sample
        if: matrix.framework == 'net8.0'
        run: |
          dotnet run --project samples/QuickStart/QuickStart.csproj -c Release

      # 公开 API 基线：任何签名变更都必须显式可见，防止无意破坏向后兼容。
      # 有意变更时按提示更新 FastData/docs/PublicAPI.txt 并提交。
      - name: Verify public API baseline
        if: matrix.os == 'ubuntu-latest' && matrix.framework == 'net8.0'
        run: |
          dotnet build tools/ApiBaseline/ApiBaseline.csproj -c Release -p:TargetFrameworks=net8.0
          dotnet tools/ApiBaseline/bin/Release/net8.0/ApiBaseline.dll > /tmp/api-current.txt

          if ! diff -u \
               <(grep -v '^#' FastData/docs/PublicAPI.txt) \
               <(grep -v '^#' /tmp/api-current.txt) > /tmp/api-diff.txt; then
            echo "::error::公开 API 与基线不一致（见下方 diff）"
            echo "如果是**有意**变更："
            echo "  dotnet run --project tools/ApiBaseline > FastData/docs/PublicAPI.txt"
            echo "  然后把该文件一并提交"
            echo "如果是**无意**变更：说明破坏了向后兼容，请回退"
            echo "--- diff (基线 vs 当前) ---"
            head -80 /tmp/api-diff.txt
            exit 1
          fi
          echo "公开 API 与基线一致（$(grep -vc '^#' FastData/docs/PublicAPI.txt) 个符号）"

      - name: Run Tests (non-integration)
        run: >
          dotnet test FastData.Tests/FastData.Tests.csproj -c Release --no-build
          --framework ${{ matrix.framework }}
          --filter "FullyQualifiedName!~Integration&FullyQualifiedName!~OrmCrudTests&FullyQualifiedName!~StressTests.Concurrent&FullyQualifiedName!~StressTests.MixedOperations" -v minimal

  # ---- 集成测试：连真实数据库跑 ----
  # 背景（issue #3）：此前的测试步骤用 `--filter "FullyQualifiedName!~Integration"`
  # 把所有集成测试永久排除在外，MultiDatabase* / Sharding 系列从未在 CI 跑过。
  # 这里起三个真实数据库容器，把 FASTDATA_RUN_DB_INTEGRATION 打开。
  integration-test:
    name: Integration Tests (MySQL / PostgreSQL / SQL Server)
    runs-on: ubuntu-latest
    needs: build-core

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: FastData@Test123
          MYSQL_DATABASE: FastDataTest
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pFastData@Test123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: FastData@Test123
          POSTGRES_DB: fastdatatest
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: FastData@Test123
        ports:
          - 1433:1433

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: |
          dotnet restore FastData.Untility/FastData.Untility.csproj -p:BuildPlatform=cross
          dotnet restore FastData/FastData.csproj -p:BuildPlatform=cross
          dotnet restore FastData.Tests/FastData.Tests.csproj -p:BuildPlatform=cross

      - name: Build test project
        run: dotnet build FastData.Tests/FastData.Tests.csproj -c Release --no-restore -f net8.0

      # SQL Server 容器没有 health-cmd（镜像里 sqlcmd 路径随版本变化），单独等端口 + 创建测试库
      - name: Wait for SQL Server and create test database
        run: |
          CID=$(docker ps --filter "ancestor=mcr.microsoft.com/mssql/server:2022-latest" --format "{{.ID}}" | head -1)
          if [ -z "$CID" ]; then
            echo "未找到 SQL Server 容器" >&2
            exit 1
          fi
          echo "container: $CID"
          for i in $(seq 1 60); do
            if docker exec "$CID" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'FastData@Test123' -C \
                 -Q "IF DB_ID('FastDataTest') IS NULL CREATE DATABASE FastDataTest" 2>/dev/null; then
              echo "FastDataTest 已就绪（第 $i 次尝试）"
              exit 0
            fi
            if docker exec "$CID" /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'FastData@Test123' \
                 -Q "IF DB_ID('FastDataTest') IS NULL CREATE DATABASE FastDataTest" 2>/dev/null; then
              echo "FastDataTest 已就绪（第 $i 次尝试，旧路径 sqlcmd）"
              exit 0
            fi
            sleep 3
          done
          echo "SQL Server 未在 180 秒内就绪或建库失败" >&2
          docker logs "$CID" 2>&1 | tail -20
          exit 1

      # 集成测试假定库里已有 perf_users 表（实体见 DatabaseIntegrationTests.PerfUser），
      # 而仓库里只为 SQLite 建过表。三个容器各自补一份，否则测试全挂在
      # "Table 'FastDataTest.perf_users' doesn't exist"。
      - name: Bootstrap test schema
        run: |
          set -e
          MY=$(docker ps --filter "ancestor=mysql:8.0" --format "{{.ID}}" | head -1)
          PG=$(docker ps --filter "ancestor=postgres:16" --format "{{.ID}}" | head -1)
          MS=$(docker ps --filter "ancestor=mcr.microsoft.com/mssql/server:2022-latest" --format "{{.ID}}" | head -1)

          echo "mysql=$MY postgres=$PG mssql=$MS"

          for i in $(seq 1 30); do
            if docker exec "$MY" mysql -uroot -p'FastData@Test123' FastDataTest -e \
              "CREATE TABLE IF NOT EXISTS perf_users (Id INT NOT NULL AUTO_INCREMENT PRIMARY KEY, UserName VARCHAR(200) NULL, Email VARCHAR(200) NULL, Age INT NOT NULL DEFAULT 0, IsActive TINYINT(1) NOT NULL DEFAULT 0, CreatedAt DATETIME(6) NOT NULL DEFAULT CURRENT_TIMESTAMP(6))" 2>/dev/null; then
              echo "MySQL perf_users ready"; break
            fi
            sleep 2
          done

          for i in $(seq 1 30); do
            if docker exec "$PG" psql -U postgres -d fastdatatest -c \
              "CREATE TABLE IF NOT EXISTS perf_users (id SERIAL PRIMARY KEY, username VARCHAR(200), email VARCHAR(200), age INTEGER NOT NULL DEFAULT 0, isactive BOOLEAN NOT NULL DEFAULT false, createdat TIMESTAMP NOT NULL DEFAULT now())" 2>/dev/null; then
              echo "PostgreSQL perf_users ready"; break
            fi
            sleep 2
          done

          docker exec "$MS" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'FastData@Test123' -C -d FastDataTest -Q \
            "IF OBJECT_ID('dbo.perf_users','U') IS NULL CREATE TABLE dbo.perf_users (Id INT IDENTITY(1,1) PRIMARY KEY, UserName NVARCHAR(200) NULL, Email NVARCHAR(200) NULL, Age INT NOT NULL DEFAULT 0, IsActive BIT NOT NULL DEFAULT 0, CreatedAt DATETIME2 NOT NULL DEFAULT SYSUTCDATETIME())" \
            || docker exec "$MS" /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'FastData@Test123' -d FastDataTest -Q \
            "IF OBJECT_ID('dbo.perf_users','U') IS NULL CREATE TABLE dbo.perf_users (Id INT IDENTITY(1,1) PRIMARY KEY, UserName NVARCHAR(200) NULL, Email NVARCHAR(200) NULL, Age INT NOT NULL DEFAULT 0, IsActive BIT NOT NULL DEFAULT 0, CreatedAt DATETIME2 NOT NULL DEFAULT SYSUTCDATETIME())"
          echo "SQL Server perf_users ready"

      - name: Run integration tests
        env:
          FASTDATA_RUN_DB_INTEGRATION: "true"
          FASTDATA_MYSQL_CONNSTR: "server=127.0.0.1;port=3306;database=FastDataTest;uid=root;pwd=FastData@Test123;SslMode=None;AllowPublicKeyRetrieval=true;Allow User Variables=true"
          FASTDATA_POSTGRESQL_CONNSTR: "host=127.0.0.1;port=5432;database=fastdatatest;username=postgres;password=FastData@Test123"
          FASTDATA_SQLSERVER_CONNSTR: "server=127.0.0.1,1433;database=FastDataTest;uid=sa;pwd=FastData@Test123;TrustServerCertificate=true;Encrypt=False"
        run: >
          dotnet test FastData.Tests/FastData.Tests.csproj -c Release --no-build
          --framework net8.0
          --filter "FullyQualifiedName~Integration|FullyQualifiedName~OrmCrudTests|FullyQualifiedName~StressTests.Concurrent|FullyQualifiedName~StressTests.MixedOperations" -v minimal

  # ---- Windows 专属项目（WinForms 两个工具 + Demo）----
  build-windows-projects:
    name: Build Windows Projects (net8.0-windows / net10.0-windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore windows projects
        run: |
          dotnet restore FastData.ModelGenerator.WinForms/FastData.ModelGenerator.WinForms.csproj
          dotnet restore FastData.SyncTool.WinForms/FastData.SyncTool.WinForms.csproj
          dotnet restore FastData.Demo/FastData.Demo.csproj

      # WinForms 项目自己的 TFM 就是 -windows 后缀，不需要 -f 覆盖，让其全部构建
      - name: Build windows projects
        run: |
          dotnet build FastData.ModelGenerator.WinForms/FastData.ModelGenerator.WinForms.csproj -c Release --no-restore
          dotnet build FastData.SyncTool.WinForms/FastData.SyncTool.WinForms.csproj -c Release --no-restore
          dotnet build FastData.Demo/FastData.Demo.csproj -c Release --no-restore

  # ---- Windows Full（含 net452 传统目标）----
  build-windows-full:
    name: Build Windows Full (includes net452)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # net452 需要引用程序集
      - name: Restore (windows full)
        run: |
          dotnet restore FastData.Untility/FastData.Untility.csproj -p:BuildPlatform=windows
          dotnet restore FastData/FastData.csproj -p:BuildPlatform=windows

      - name: Build net452
        run: |
          dotnet build FastData.Untility/FastData.Untility.csproj -c Release -f net452 --no-restore -p:BuildPlatform=windows
          dotnet build FastData/FastData.csproj -c Release -f net452 --no-restore -p:BuildPlatform=windows

      - name: Build net8.0
        run: |
          dotnet build FastData.Untility/FastData.Untility.csproj -c Release -f net8.0 --no-restore
          dotnet build FastData/FastData.csproj -c Release -f net8.0 --no-restore

      # net452 此前只编译、从不运行测试 ——「声明支持却不验证」。
      # Windows runner 起不了 service container，所以只跑不依赖数据库的那批用例。
      - name: Run net452 tests
        run: |
          dotnet build FastData.Tests.Net452/FastData.Tests.Net452.csproj -c Release -p:BuildPlatform=windows -nologo

          nuget install xunit.runner.console -Version 2.6.2 -OutputDirectory tools\xunit -NonInteractive
          $runner = "tools\xunit\xunit.runner.console.2.6.2\tools\net452\xunit.console.exe"
          if (!(Test-Path $runner)) { throw "找不到 xunit.console.exe: $runner" }

          & $runner FastData.Tests.Net452\bin\Release\net452\FastData.Tests.dll -nologo -noshadow -verbose
          if ($LASTEXITCODE -ne 0) { throw "net452 测试失败，退出码 $LASTEXITCODE" }

  # ---- 安全扫描 ----
  # ---- 性能基准 ----
  # 只跑纯 CPU 的 SQL 生成层：输入固定、结果确定，不受 runner 负载影响。
  # 不做阈值判定 —— 单次结果波动足以造成误报，阈值需要长期趋势才能定。
  # 产物（markdown + json）归档，供人工比对与后续建趋势。
  benchmark:
    name: Benchmark (SQL generation)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Run benchmarks
        run: |
          # 必须显式传 --filter：BenchmarkSwitcher 在无参数时会进入交互式选择，
          # CI 里没有 stdin，会直接结束且不产出任何结果（job 绿了但什么都没跑）。
          dotnet run -c Release \
            --project benchmarks/FastData.Benchmarks/FastData.Benchmarks.csproj \
            -p:TargetFrameworks=net8.0 \
            -- --filter '*'
          # 产物落在工作目录（仓库根），不是项目目录
          ls -la BenchmarkDotNet.Artifacts/results/

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/
          if-no-files-found: error

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore for scan
        run: |
          dotnet restore FastData/FastData.csproj -p:BuildPlatform=cross
          dotnet restore FastData.Tests/FastData.Tests.csproj -p:BuildPlatform=cross

      # `dotnet list package --vulnerable` 只打印、退出码恒为 0，
      # 原来的写法加上 continue-on-error，等于「扫了但永远不会拦」。
      # 改为解析输出并显式判定。
      - name: Check for vulnerable packages
        run: |
          python3 tools/check-vulnerabilities.py \
            FastData/FastData.csproj \
            FastData.Untility/FastData.Untility.csproj \
            FastData.Tests/FastData.Tests.csproj

      - name: Build with analyzers
        run: |
          dotnet build FastData/FastData.csproj -c Release --no-restore /p:RunAnalyzers=true
          dotnet build FastData.Tests/FastData.Tests.csproj -c Release --no-restore /p:RunAnalyzers=true

  # ---- NuGet 打包 ----
  package:
    name: Package NuGet
    runs-on: windows-latest
    needs: [build-core, integration-test, build-windows-projects, build-windows-full, security-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || github.ref == 'refs/heads/master')

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # 包必须包含全部声明的目标框架。
      # 此前这里用 BuildPlatform=cross（排除 net452）且 pack 时写死 TargetFrameworks=net8.0，
      # 于是 README 宣称支持 net452 / net8 / net10，实际发出去的包只有 net8.0。
      - name: Restore (all target frameworks)
        run: |
          dotnet restore FastData/FastData.csproj -p:BuildPlatform=windows
          dotnet restore FastData.Untility/FastData.Untility.csproj -p:BuildPlatform=windows

      - name: Build (all target frameworks)
        run: |
          dotnet build FastData/FastData.csproj -c Release --no-restore -p:BuildPlatform=windows
          dotnet build FastData.Untility/FastData.Untility.csproj -c Release --no-restore -p:BuildPlatform=windows

      - name: Pack
        run: |
          # 版本号：master 上的持续构建用 CI 预发布号，避免与已发布版本冲突。
          # 正式发布走 release.yml（tag 触发），版本取 tag。
          $version = "1.0.0-ci.${{ github.run_number }}"
          Write-Host "packing version $version"
          dotnet pack FastData/FastData.csproj -c Release --no-build -p:BuildPlatform=windows -p:Version=$version -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg -o artifacts
          dotnet pack FastData.Untility/FastData.Untility.csproj -c Release --no-build -p:BuildPlatform=windows -p:Version=$version -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg -o artifacts

      # 把包内容打印出来，避免「打包成功但内容不对」再次发生
      - name: Inspect package contents
        run: |
          Get-ChildItem artifacts/*.nupkg | ForEach-Object {
            Write-Host "=== $($_.Name) ==="
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $zip = [System.IO.Compression.ZipFile]::OpenRead($_.FullName)
            $zip.Entries | Where-Object { $_.FullName -like "lib/*" } | ForEach-Object { Write-Host "  $($_.FullName)" }
            $zip.Dispose()
          }

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          retention-days: 30
